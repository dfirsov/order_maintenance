name = "OM"
defaultTargets = ["OM"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[lean_lib]]
name = "OM"

[[lean_exe]]
name = "replay"
root = "OM.Test.Replay"

[[lean_exe]]
name = "extract"
root = "OM.Extract.Main"

[[lean_exe]]
name = "xrun"
root = "OM.Extract.XRun"
